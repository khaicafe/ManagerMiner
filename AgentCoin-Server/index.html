<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Coin Miner</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 300px;
        margin-top: 10px;
        font-family: monospace;
      }
      button {
        margin-right: 10px;
        margin-bottom: 10px;
      }
      #status {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Agent Coin Miner</h2>
    <p>Service Status: <span id="status">Loading...</span></p>
    <button id="install">Install Service</button>
    <button id="uninstall">Uninstall Service</button>
    <button id="start">Start Service</button>
    <button id="stop">Stop Service</button>
    <button id="dev">Run Dev</button>
    <br />
    <textarea id="log" readonly></textarea>
    <script src="renderer.js"></script>
  </body>
</html>
